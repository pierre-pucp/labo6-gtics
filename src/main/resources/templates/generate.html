<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio 6</title>
</head>
<body>
    <div th:replace="~{fragments/general.html :: headbar}">
    </div>
    <h3>Generar juego</h3>

    <div>
        <h3>STF GAMES: Pupiletras</h3>
        <form th:action="@{/generar}" th:object="${game} method="post">
            <div>
                <label>Numero de filas:</label>
                <input type="number" th:field="*{nLine}" required>
            </div>

            <div>
                <label>Numero de columnas:</label>
                <input type="number" th:field="*{nColumn}" required>
            </div>

            <div>
                <label>Palabras a encontrar:</label>
                <input type="text"  th:field="*{words}" required>
            </div>

            <div>
                <button type="submit">Iniciar Juego</button>
            </div>
        </form>
    </div>
</body>
