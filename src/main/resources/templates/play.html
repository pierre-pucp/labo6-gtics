<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio 6</title>
</head>
<body>
    <div th:replace="~{fragments/general.html :: headbar}">
    </div>
    <h3>Jugar</h3>

    <div>
        <h3>Encuentre todas las palabras</h3>
        <form th:action="@{/buscar}" method="get">
            <div>
                <label>Coordenadas de la palabra a encontrar:</label>
                <input type="text"  th:name="xyStart" required>
                <input type="text"  th:name="xyEnd" required>
                <button type="submit">Iniciar Juego</button>
            </div>
        </form>

        <table>
            <tr th:each="l : ${lines}">
                <td th:each="c : ${l.cases}" th:text="${c.letter}"></td>
            </tr>
        </table>
    </div>

</body>
